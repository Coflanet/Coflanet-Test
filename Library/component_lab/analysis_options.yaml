include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
  errors:
    # Treat unused imports as errors so we keep imports lean.
    unused_import: error
    # Encourage const constructors via lint, not just info.
    prefer_const_constructors: warning
    prefer_const_literals_to_create_immutables: warning

linter:
  rules:
    avoid_print: false
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_locals: true
    sort_child_properties_last: true
    use_super_parameters: true
    # 공개 API에는 코멘트 필수가 아님 — 디자인 시스템 위젯의 외부 docstring은
    # 코드 페이지의 한국어 docstring만 유지.
    public_member_api_docs: false
