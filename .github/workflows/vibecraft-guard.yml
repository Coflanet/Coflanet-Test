# ============================================================
# VibeCraft Guard - vibecraft.ignore 존재 여부 검증
# ============================================================
# 이 워크플로우를 forked 프로젝트에 복사하세요.
# Branch Protection → Required Status Checks에 "vibecraft-guard"를 추가하면
# vibecraft.ignore가 없는 PR은 머지가 차단됩니다.
# ============================================================

name: vibecraft-guard

on:
  pull_request:
  push:

jobs:
  check-vibecraft:
    name: VibeCraft Guard
    runs-on: ubuntu-latest
    if: ${{ github.repository != 'VibeCraft2204/vibecraft.ignore' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find vibecraft.ignore
        run: |
          VIBECRAFT_IGNORE=""
          if [ -f "vibecraft.ignore" ]; then
            VIBECRAFT_IGNORE="vibecraft.ignore"
          elif [ -f ".vibecraft/vibecraft.ignore" ]; then
            VIBECRAFT_IGNORE=".vibecraft/vibecraft.ignore"
          else
            VIBECRAFT_IGNORE=$(find . -name "vibecraft.ignore" -type f \
              -not -path "./.git/*" -not -path "./.vibecraft/source/*" 2>/dev/null | head -1)
          fi

          if [ -z "$VIBECRAFT_IGNORE" ]; then
            echo "::error::vibecraft.ignore 파일이 없습니다."
            echo ""
            echo "이 프로젝트는 VibeCraft2204 워크플로우가 적용되지 않았습니다."
            echo "setup-fork.sh를 실행하여 vibecraft.ignore를 추가하세요:"
            echo ""
            echo "  curl -sL https://raw.githubusercontent.com/VibeCraft2204/vibecraft.ignore/main/scripts/setup-fork.sh | bash"
            echo ""
            exit 1
          fi

          echo "vibecraft.ignore 경로: $VIBECRAFT_IGNORE"
          echo "VIBECRAFT_IGNORE=$VIBECRAFT_IGNORE" >> $GITHUB_ENV

      - name: Validate vibecraft.ignore format
        run: |
          if [ ! -s "$VIBECRAFT_IGNORE" ]; then
            echo "::error::vibecraft.ignore 파일이 비어있습니다."
            exit 1
          fi
          echo "vibecraft.ignore 형식 검증 완료"

      - name: Validate required defaults
        run: |
          # .vibecraft/required-patterns.txt에서 필수 패턴 읽기
          PATTERNS_FILE=".vibecraft/required-patterns.txt"
          if [ ! -f "$PATTERNS_FILE" ]; then
            echo "::error::$PATTERNS_FILE 파일이 없습니다."
            echo "setup-fork.sh를 다시 실행하세요."
            exit 1
          fi

          MISSING=0
          COUNT=0

          while IFS= read -r pattern; do
            # 주석/빈줄 제외
            pattern=$(echo "$pattern" | sed 's/#.*//' | xargs)
            [ -z "$pattern" ] && continue

            COUNT=$((COUNT + 1))
            if ! grep -qF "$pattern" "$VIBECRAFT_IGNORE"; then
              echo "::error::필수 패턴 누락: $pattern"
              MISSING=1
            fi
          done < "$PATTERNS_FILE"

          if [ "$MISSING" -eq 1 ]; then
            echo ""
            echo "vibecraft.ignore에 필수 기본 패턴이 빠져있습니다."
            echo "setup-fork.sh를 다시 실행하거나 수동으로 추가하세요."
            exit 1
          fi

          echo "필수 기본 패턴 검증 완료 (${COUNT}개)"
