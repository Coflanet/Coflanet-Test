# ============================================================
# Sync to Upstream Origin - VibeCraft 파일 제외 후 자동 동기화
# ============================================================
# forked repo의 main에 머지되면
# vibecraft.ignore에 나열된 파일을 제거한 뒤
# 고객사 origin 레포로 자동 PR을 생성합니다.
#
# vibecraft.ignore에 포함된 파일만 변경된 경우에는
# origin에 PR을 생성하지 않습니다.
# ============================================================

name: sync-upstream

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (PR 생성하지 않고 확인만)'
        required: false
        default: 'false'
        type: boolean

env:
  UPSTREAM_BRANCH: 'main'

jobs:
  sync:
    name: Sync to Origin
    runs-on: ubuntu-latest
    # UPSTREAM_REPO가 설정된 경우에만 실행
    if: ${{ vars.UPSTREAM_REPO != '' || github.event.inputs.dry_run == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify vibecraft.ignore
        run: |
          if [ ! -f "vibecraft.ignore" ]; then
            echo "::error::vibecraft.ignore가 없습니다. 동기화를 중단합니다."
            exit 1
          fi

      - name: Setup upstream remote
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          UPSTREAM="${{ vars.UPSTREAM_REPO }}"

          if [ -z "$UPSTREAM" ]; then
            echo "::error::UPSTREAM_REPO가 설정되지 않았습니다."
            echo "Repository Variables에 UPSTREAM_REPO를 설정하세요."
            exit 1
          fi

          # gh CLI를 git credential helper로 설정 (GH_TOKEN env를 자동 사용)
          gh auth setup-git

          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream "${{ env.UPSTREAM_BRANCH }}"
          echo "UPSTREAM=$UPSTREAM" >> $GITHUB_ENV

      - name: Configure git identity
        run: |
          git config user.name "vibecraft-bot"
          git config user.email "vibecraft-bot@users.noreply.github.com"

      - name: Create clean branch from upstream
        run: |
          CLEAN_BRANCH="sync/upstream-$(date +%Y%m%d-%H%M%S)"

          # fork의 index에서 vibecraft 파일 제거 → clean tree 저장
          while IFS= read -r pattern || [ -n "$pattern" ]; do
            [[ "$pattern" =~ ^#.*$ ]] && continue
            [[ -z "$pattern" ]] && continue
            git rm -rf --ignore-unmatch $pattern 2>/dev/null || true
          done < vibecraft.ignore
          CLEAN_TREE=$(git write-tree)

          # upstream/main에서 브랜치 생성 후 clean tree 적용
          git checkout -b "$CLEAN_BRANCH" "upstream/${{ env.UPSTREAM_BRANCH }}"
          git read-tree -u --reset "$CLEAN_TREE"

          echo "CLEAN_BRANCH=$CLEAN_BRANCH" >> $GITHUB_ENV

      - name: Check for real changes
        run: |
          if git diff --cached --quiet; then
            echo "::notice::vibecraft 파일만 변경됨. origin 동기화를 건너뜁니다."
            echo "SKIP_SYNC=true" >> $GITHUB_ENV
          else
            FORK_OWNER="${{ github.repository_owner }}"
            echo "실제 코드 변경 감지됨. origin 동기화를 진행합니다."
            echo "SKIP_SYNC=false" >> $GITHUB_ENV
            git commit -m "sync: ${FORK_OWNER} → upstream"
          fi

      - name: Push clean branch and create PR
        if: ${{ env.SKIP_SYNC != 'true' && github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          # 현재 repo의 org/owner 추출 (PR 제목에 사용)
          FORK_OWNER="${{ github.repository_owner }}"

          # 1차 시도: upstream에 직접 push 후 PR 생성 → 즉시 merge
          if git push upstream "$CLEAN_BRANCH" 2>/dev/null; then
            echo "upstream에 직접 push 성공"
            PR_URL=$(gh pr create \
              --repo "$UPSTREAM" \
              --base "${{ env.UPSTREAM_BRANCH }}" \
              --head "$CLEAN_BRANCH" \
              --title "sync: ${FORK_OWNER} → upstream ($(date +%Y-%m-%d))" \
              --body "")

            # PR 즉시 merge 후 브랜치 삭제
            if gh pr merge "$PR_URL" --squash --delete-branch 2>/dev/null; then
              echo "PR merge 완료"
            else
              echo "::warning::PR auto-merge 실패. 수동으로 merge하세요: $PR_URL"
            fi
          else
            # Fallback: push 권한 없음 → fork에 push 후 cross-fork PR 생성
            echo "::warning::upstream 직접 push 실패. fork 경유 PR로 전환합니다."

            # fork repo에 push하기 위해 origin 재설정
            git remote set-url origin "https://github.com/${{ github.repository }}.git"
            gh auth setup-git
            git push origin "$CLEAN_BRANCH"

            # cross-fork PR 생성 (fork:branch → upstream:branch)
            gh pr create \
              --repo "$UPSTREAM" \
              --base "${{ env.UPSTREAM_BRANCH }}" \
              --head "${FORK_OWNER}:${CLEAN_BRANCH}" \
              --title "sync: ${FORK_OWNER} → upstream ($(date +%Y-%m-%d))" \
              --body ""
          fi

      - name: Skip notice
        if: ${{ env.SKIP_SYNC == 'true' && github.event.inputs.dry_run != 'true' }}
        run: |
          echo "::notice::vibecraft 전용 변경이므로 origin PR을 생성하지 않았습니다."

      - name: Dry run summary
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "=== Dry Run Summary ==="
          if [ "$SKIP_SYNC" = "true" ]; then
            echo "결과: vibecraft 파일만 변경됨 → origin 동기화 건너뜀"
          else
            echo "결과: 실제 코드 변경 있음 → origin 동기화 대상"
            echo ""
            echo "변경된 파일:"
            git diff --cached --name-only
          fi
          echo ""
          echo "현재 브랜치 파일 목록:"
          git ls-files
