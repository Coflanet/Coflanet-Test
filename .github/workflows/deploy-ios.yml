name: Deploy to TestFlight

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to deploy (e.g., v1.0.0)'
        required: true

jobs:
  deploy:
    name: Upload to TestFlight
    if: github.repository == 'PlanewTech/coflanet-app'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ios/fastlane
          sparse-checkout-cone-mode: false

      - name: Download IPA from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ${{ inputs.release_tag }} \
            --repo ${{ github.repository }} \
            --pattern "*.ipa" \
            --dir artifacts

      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          IPA_PATH=$(ls artifacts/*.ipa | head -1)
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > $RUNNER_TEMP/AuthKey.p8
          cd ios && bundle exec fastlane upload_testflight \
            api_key_path:$RUNNER_TEMP/AuthKey.p8 \
            api_key_id:$APP_STORE_CONNECT_API_KEY_ID \
            api_key_issuer_id:$APP_STORE_CONNECT_ISSUER_ID \
            ipa_path:../$IPA_PATH
