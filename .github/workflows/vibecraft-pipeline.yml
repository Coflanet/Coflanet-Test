# ============================================================
# VibeCraft Pipeline - Guard → Secure → Publish
# ============================================================
# 단일 워크플로우로 통합된 VibeCraft 보호 파이프라인.
#   PR/push: guard만 실행 (Required Status Check)
#   push to main: guard → check-config → secure → publish 순차 실행
#
# Branch Protection에 "vibecraft-pipeline / VibeCraft Guard" 추가
# ============================================================

name: vibecraft-pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: vibecraft-pipeline-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM_BRANCH: 'main'
  MIRROR_BRANCH: 'client-mirror'

jobs:
  # ── Job 1: Guard ─────────────────────────────────────────
  # vibecraft.ignore 존재 + 필수 패턴 검증
  guard:
    name: VibeCraft Guard
    runs-on: ubuntu-latest
    if: ${{ github.repository != 'VibeCraft2204/vibecraft.ignore' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find vibecraft.ignore
        run: |
          VIBECRAFT_IGNORE=""
          if [ -f "vibecraft.ignore" ]; then
            VIBECRAFT_IGNORE="vibecraft.ignore"
          elif [ -f ".vibecraft/vibecraft.ignore" ]; then
            VIBECRAFT_IGNORE=".vibecraft/vibecraft.ignore"
          else
            VIBECRAFT_IGNORE=$(find . -name "vibecraft.ignore" -type f \
              -not -path "./.git/*" -not -path "./.vibecraft/source/*" 2>/dev/null | head -1)
          fi

          if [ -z "$VIBECRAFT_IGNORE" ]; then
            echo "::error::vibecraft.ignore 파일이 없습니다."
            echo ""
            echo "이 프로젝트는 VibeCraft2204 워크플로우가 적용되지 않았습니다."
            echo "setup-fork.sh를 실행하여 vibecraft.ignore를 추가하세요:"
            echo ""
            echo "  curl -sL https://raw.githubusercontent.com/VibeCraft2204/vibecraft.ignore/main/.vibecraft/scripts/setup-fork.sh | bash"
            echo ""
            exit 1
          fi

          echo "vibecraft.ignore 경로: $VIBECRAFT_IGNORE"
          echo "VIBECRAFT_IGNORE=$VIBECRAFT_IGNORE" >> $GITHUB_ENV

      - name: Validate vibecraft.ignore format
        run: |
          if [ ! -s "$VIBECRAFT_IGNORE" ]; then
            echo "::error::vibecraft.ignore 파일이 비어있습니다."
            exit 1
          fi
          echo "vibecraft.ignore 형식 검증 완료"

      - name: Validate required defaults
        run: |
          PATTERNS_FILE=".vibecraft/vibecraft-patterns"
          if [ ! -f "$PATTERNS_FILE" ]; then
            echo "::error::$PATTERNS_FILE 파일이 없습니다."
            echo "setup-fork.sh를 다시 실행하세요."
            exit 1
          fi

          MISSING=0
          COUNT=0

          while IFS= read -r pattern; do
            pattern=$(echo "$pattern" | sed 's/#.*//' | xargs)
            [ -z "$pattern" ] && continue

            COUNT=$((COUNT + 1))
            if ! grep -qF "$pattern" "$VIBECRAFT_IGNORE"; then
              echo "::error::필수 패턴 누락: $pattern"
              MISSING=1
            fi
          done < "$PATTERNS_FILE"

          if [ "$MISSING" -eq 1 ]; then
            echo ""
            echo "vibecraft.ignore에 필수 기본 패턴이 빠져있습니다."
            echo "setup-fork.sh를 다시 실행하거나 수동으로 추가하세요."
            exit 1
          fi

          echo "필수 기본 패턴 검증 완료 (${COUNT}개)"

      - name: Validate secret-patterns superset
        run: |
          SECRET_FILE=".vibecraft/secret-patterns"
          if [ ! -f "$SECRET_FILE" ]; then
            echo "::warning::secret-patterns 파일이 없습니다. 마이그레이션 전일 수 있습니다."
            exit 0
          fi

          MISSING=0
          while IFS= read -r pattern; do
            pattern=$(echo "$pattern" | sed 's/#.*//' | xargs)
            [ -z "$pattern" ] && continue

            if ! grep -qF "$pattern" "$VIBECRAFT_IGNORE"; then
              echo "::error::vibecraft.ignore에 secret-patterns 패턴 누락: $pattern"
              MISSING=1
            fi
          done < "$SECRET_FILE"

          if [ "$MISSING" -eq 1 ]; then
            echo ""
            echo "secret-patterns의 모든 패턴은 vibecraft.ignore에 포함되어야 합니다."
            echo "setup-fork.sh를 다시 실행하거나 수동으로 추가하세요."
            exit 1
          fi
          echo "secret-patterns superset 검증 완료"

  # ── Job 2: Check Config ──────────────────────────────────
  # SECURE_ENABLED 설정 읽기 (push to main + dispatch만)
  check-config:
    needs: [guard]
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    outputs:
      secure_enabled: ${{ steps.config.outputs.secure_enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: '.vibecraft/config'
          sparse-checkout-cone-mode: false
      - id: config
        run: |
          if [ -f ".vibecraft/config" ] && grep -q "^SECURE_ENABLED=true" ".vibecraft/config"; then
            echo "secure_enabled=true" >> $GITHUB_OUTPUT
          else
            echo "secure_enabled=false" >> $GITHUB_OUTPUT
          fi

  # ── Job 3: Secure ────────────────────────────────────────
  # Metadata obfuscation (SECURE_ENABLED=true일 때만)
  secure:
    needs: [check-config]
    if: ${{ needs.check-config.outputs.secure_enabled == 'true' }}
    name: Apply Defense Layers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install vibecraft-secure dependencies
        run: |
          cd .vibecraft/vibecraft-secure
          npm ci --ignore-scripts

      - name: Find vibecraft.ignore
        run: |
          VIBECRAFT_IGNORE=""
          if [ -f "vibecraft.ignore" ]; then
            VIBECRAFT_IGNORE="vibecraft.ignore"
          elif [ -f ".vibecraft/vibecraft.ignore" ]; then
            VIBECRAFT_IGNORE=".vibecraft/vibecraft.ignore"
          else
            VIBECRAFT_IGNORE=$(find . -name "vibecraft.ignore" -type f \
              -not -path "./.git/*" -not -path "./.vibecraft/source/*" 2>/dev/null | head -1)
          fi

          if [ -z "$VIBECRAFT_IGNORE" ]; then
            echo "::error::vibecraft.ignore not found."
            exit 1
          fi

          echo "VIBECRAFT_IGNORE=$VIBECRAFT_IGNORE" >> $GITHUB_ENV

      - name: Create clean work tree
        run: |
          WORK_DIR=$(mktemp -d)
          echo "WORK_DIR=$WORK_DIR" >> $GITHUB_ENV

          rsync -a --exclude='.git' . "$WORK_DIR/"

          cd "$WORK_DIR"
          while IFS= read -r pattern || [ -n "$pattern" ]; do
            [[ "$pattern" =~ ^#.*$ ]] && continue
            [[ -z "$pattern" ]] && continue
            pattern="${pattern%/}"
            find . -path "./$pattern" -exec rm -rf {} + 2>/dev/null || true
          done < "$GITHUB_WORKSPACE/$VIBECRAFT_IGNORE"
          cd "$GITHUB_WORKSPACE"

      - name: Apply vibecraft-secure metadata obfuscation
        run: |
          node .vibecraft/vibecraft-secure/inject.mjs "$WORK_DIR"

      - name: Setup Flutter (if needed)
        if: hashFiles('pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Auto-fix formatting (Dart/Flutter)
        if: hashFiles('pubspec.yaml') != ''
        run: |
          echo "Flutter/Dart project detected. Applying dart format..."
          cd "$WORK_DIR"
          dart format .
          cd "$GITHUB_WORKSPACE"

      - name: Build verification
        run: |
          cd "$WORK_DIR"

          if [ -f "package.json" ]; then
            if grep -q '"build"' package.json; then
              echo "Running npm build verification..."
              npm install --ignore-scripts 2>/dev/null || true
              npm run build || {
                echo "::error::Build failed after applying vibecraft-secure."
                exit 1
              }
              echo "Build verification passed."
            else
              echo "No build script found. Skipping build verification."
            fi
          elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "Gradle project detected. Running build..."
            GRADLE_EXCLUDES="-x test"
            if ./gradlew tasks --all 2>/dev/null | grep -q "lint -"; then
              GRADLE_EXCLUDES="$GRADLE_EXCLUDES -x lint -x lintAnalyzeDebug"
            fi
            ./gradlew build $GRADLE_EXCLUDES || {
              echo "::error::Gradle build failed after applying vibecraft-secure."
              exit 1
            }
          elif [ -f "pom.xml" ]; then
            echo "Maven project detected. Running build..."
            mvn compile -q || {
              echo "::error::Maven build failed after applying vibecraft-secure."
              exit 1
            }
          elif [ -f "requirements.txt" ] || [ -f "setup.py" ] || [ -f "pyproject.toml" ]; then
            echo "Python project detected. Running syntax check..."
            find . -name "*.py" -exec python3 -m py_compile {} + || {
              echo "::error::Python syntax check failed after applying vibecraft-secure."
              exit 1
            }
          else
            echo "No recognized build system. Skipping build verification."
          fi

      - name: Clean build artifacts
        run: |
          cd "$WORK_DIR"
          for d in build dist .gradle .next node_modules out target __pycache__; do
            find . -type d -name "$d" -exec rm -rf {} + 2>/dev/null || true
          done
          find . -type f -size +100M -delete 2>/dev/null || true

      - name: Upload protected tree as artifact
        uses: actions/upload-artifact@v4
        with:
          name: protected-tree
          path: ${{ env.WORK_DIR }}
          include-hidden-files: true
          retention-days: 1

      - name: Cleanup
        if: always()
        run: rm -rf "$WORK_DIR"

  # ── Job 4: Publish ───────────────────────────────────────
  # Upstream으로 clean code push (orphan commit + force push)
  publish:
    needs: [guard, check-config, secure]
    if: >
      always() &&
      needs.guard.result == 'success' &&
      needs.check-config.result == 'success' &&
      (needs.secure.result == 'success' || needs.secure.result == 'skipped') &&
      github.repository != 'VibeCraft2204/vibecraft.ignore' &&
      vars.UPSTREAM_REPO != ''
    name: Publish to Origin
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download protected artifact
        id: download-artifact
        if: needs.secure.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: protected-tree
          path: protected-tree

      - name: Find vibecraft.ignore
        run: |
          VIBECRAFT_IGNORE=""
          if [ -f "vibecraft.ignore" ]; then
            VIBECRAFT_IGNORE="vibecraft.ignore"
          elif [ -f ".vibecraft/vibecraft.ignore" ]; then
            VIBECRAFT_IGNORE=".vibecraft/vibecraft.ignore"
          else
            VIBECRAFT_IGNORE=$(find . -name "vibecraft.ignore" -type f \
              -not -path "./.git/*" -not -path "./.vibecraft/source/*" 2>/dev/null | head -1)
          fi

          if [ -z "$VIBECRAFT_IGNORE" ]; then
            echo "::error::vibecraft.ignore not found."
            exit 1
          fi

          echo "VIBECRAFT_IGNORE=$VIBECRAFT_IGNORE" >> $GITHUB_ENV

      - name: Setup upstream remote
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          UPSTREAM="${{ vars.UPSTREAM_REPO }}"

          if [ -z "$UPSTREAM" ]; then
            echo "::error::UPSTREAM_REPO not configured."
            exit 1
          fi

          gh auth setup-git

          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream "$UPSTREAM_BRANCH" || true
          git fetch upstream "$MIRROR_BRANCH" || true
          echo "UPSTREAM=$UPSTREAM" >> $GITHUB_ENV

      - name: Configure git identity
        run: |
          git config user.name "vibecraft-bot"
          git config user.email "vibecraft-bot@users.noreply.github.com"

      - name: Create clean tree
        run: |
          GIT_INDEX_FILE=$(mktemp -u)
          export GIT_INDEX_FILE

          if [ -d "protected-tree" ]; then
            # vibecraft-secure가 보호 처리한 파일로 tree 생성
            declare -A EXEC_FILES
            while IFS=$'\t' read -r mode rest; do
              path="${rest##*	}"
              [ "$mode" = "100755" ] && EXEC_FILES["$path"]=1
            done < <(git ls-tree -r HEAD | awk '{print $1"\t"$4}')

            PROTECTED_DIR="$GITHUB_WORKSPACE/protected-tree"
            while IFS= read -r relpath; do
              BLOB=$(git hash-object -w "$PROTECTED_DIR/$relpath")
              FILE_MODE="100644"
              [ "${EXEC_FILES[$relpath]+_}" ] && FILE_MODE="100755"
              git update-index --add --cacheinfo "$FILE_MODE","$BLOB","$relpath"
            done < <(cd "$PROTECTED_DIR" && find . -type f -not -path './.git/*' | sed 's|^\./||')
            CLEAN_TREE=$(git write-tree)
          else
            # SECURE_ENABLED=false: HEAD에서 vibecraft 파일 제거
            git read-tree HEAD
            while IFS= read -r pattern || [ -n "$pattern" ]; do
              [[ "$pattern" =~ ^#.*$ ]] && continue
              [[ -z "$pattern" ]] && continue
              git rm -rf --cached --ignore-unmatch $pattern 2>/dev/null || true
            done < "$VIBECRAFT_IGNORE"
            CLEAN_TREE=$(git write-tree)
          fi

          unset GIT_INDEX_FILE
          echo "CLEAN_TREE=$CLEAN_TREE" >> $GITHUB_ENV

      - name: Create publish commit
        run: |
          FORK_OWNER="${{ github.repository_owner }}"
          SECURED=""
          if [ -d "protected-tree" ]; then
            SECURED=" [secured]"
          fi
          PUBLISH_MSG="publish: ${FORK_OWNER} -> upstream ($(date +%Y-%m-%d))${SECURED}"

          ORPHAN_COMMIT=$(git commit-tree "$CLEAN_TREE" -m "initial release")
          git branch -f "$MIRROR_BRANCH" "$ORPHAN_COMMIT"

          if git rev-parse "upstream/$UPSTREAM_BRANCH" &>/dev/null 2>&1; then
            PARENT=$(git rev-parse "upstream/$UPSTREAM_BRANCH")
            PR_COMMIT=$(git commit-tree "$CLEAN_TREE" -p "$PARENT" -m "$PUBLISH_MSG")
            git branch -f "${MIRROR_BRANCH}-pr" "$PR_COMMIT"
          fi

          echo "PUBLISH_MSG=$PUBLISH_MSG" >> $GITHUB_ENV

      - name: Check for real changes
        run: |
          UPSTREAM_TREE=$(git rev-parse "upstream/$UPSTREAM_BRANCH^{tree}" 2>/dev/null || echo "")
          MIRROR_TREE=$(git rev-parse "$MIRROR_BRANCH^{tree}")

          if [ -n "$UPSTREAM_TREE" ] && [ "$UPSTREAM_TREE" = "$MIRROR_TREE" ]; then
            echo "::notice::No real changes. Skipping push."
            echo "SKIP_PUBLISH=true" >> $GITHUB_ENV
          fi

      - name: Push to upstream
        if: env.SKIP_PUBLISH != 'true'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          if git push upstream "$MIRROR_BRANCH:$UPSTREAM_BRANCH" --force 2>/dev/null; then
            echo "::notice::Force push succeeded. Upstream has clean single commit."
            echo "PUSH_METHOD=force" >> $GITHUB_ENV
          elif git rev-parse "${MIRROR_BRANCH}-pr" &>/dev/null 2>&1; then
            PR_BRANCH="publish/$(date +%Y%m%d-%H%M%S)"
            git push upstream "${MIRROR_BRANCH}-pr:refs/heads/$PR_BRANCH" 2>/dev/null || {
              echo "::error::Both force push and PR branch push failed."
              exit 1
            }
            echo "::notice::Force push blocked. Creating PR instead."
            echo "PR_BRANCH=$PR_BRANCH" >> $GITHUB_ENV
            echo "PUSH_METHOD=pr" >> $GITHUB_ENV
          else
            echo "::error::Push failed and no PR fallback available."
            exit 1
          fi

      - name: Create PR (fallback)
        if: env.PUSH_METHOD == 'pr'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          gh pr create \
            --repo "$UPSTREAM" \
            --base "$UPSTREAM_BRANCH" \
            --head "$PR_BRANCH" \
            --title "$PUBLISH_MSG" \
            --body "Automated publish from ${{ github.repository }}. Force push was blocked by branch protection." \
            2>/dev/null || echo "::warning::PR creation failed. Branch pushed: $PR_BRANCH"

      - name: Skip notice
        if: env.SKIP_PUBLISH == 'true'
        run: echo "::notice::No changes to publish."
