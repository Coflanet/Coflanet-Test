# ============================================================
# Publish to Upstream Origin - Orphan Commit 방식 자동 고객사 배포
# ============================================================
# 매 publish마다 orphan commit(이력 없음)으로 force push.
# force push 불가 시 upstream/main 기반 PR로 폴백.
# 이전 버전은 태그/릴리즈로 보존.
#
# 두 가지 경로로 실행:
#   1. push (.vibecraft/config SECURE_ENABLED!=true): 원본 코드로 upstream push
#   2. workflow_run (vibecraft-secure 완료 후): 보호된 코드로 upstream push
# ============================================================

name: publish-upstream

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["vibecraft-secure"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: upstream-publish-${{ github.repository }}
  cancel-in-progress: false

env:
  UPSTREAM_BRANCH: 'main'
  MIRROR_BRANCH: 'client-mirror'

jobs:
  check-config:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    outputs:
      secure_enabled: ${{ steps.config.outputs.secure_enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: '.vibecraft/config'
          sparse-checkout-cone-mode: false
      - id: config
        run: |
          if [ -f ".vibecraft/config" ] && grep -q "^SECURE_ENABLED=true" ".vibecraft/config"; then
            echo "secure_enabled=true" >> $GITHUB_OUTPUT
          else
            echo "secure_enabled=false" >> $GITHUB_OUTPUT
          fi

  publish:
    needs: [check-config]
    if: >
      always() && (
        (github.event_name == 'push'
         && needs.check-config.outputs.secure_enabled != 'true'
         && github.repository != 'VibeCraft2204/vibecraft.ignore'
         && vars.UPSTREAM_REPO != '') ||
        (github.event_name == 'workflow_run'
         && github.event.workflow_run.conclusion == 'success') ||
        github.event_name == 'workflow_dispatch'
      )
    name: Publish to Origin
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download protected artifact
        id: download-artifact
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: protected-tree
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: protected-tree

      - name: Skip if no artifact (SECURE_ENABLED=false)
        if: github.event_name == 'workflow_run' && steps.download-artifact.outcome == 'failure'
        run: |
          echo "::notice::vibecraft-secure completed without artifact (SECURE_ENABLED=false). Skipping — push trigger handles this path."
          echo "SKIP_PUBLISH=true" >> $GITHUB_ENV

      - name: Find vibecraft.ignore
        if: env.SKIP_PUBLISH != 'true'
        run: |
          VIBECRAFT_IGNORE=""
          if [ -f "vibecraft.ignore" ]; then
            VIBECRAFT_IGNORE="vibecraft.ignore"
          elif [ -f ".vibecraft/vibecraft.ignore" ]; then
            VIBECRAFT_IGNORE=".vibecraft/vibecraft.ignore"
          else
            VIBECRAFT_IGNORE=$(find . -name "vibecraft.ignore" -type f \
              -not -path "./.git/*" -not -path "./.vibecraft/source/*" 2>/dev/null | head -1)
          fi

          if [ -z "$VIBECRAFT_IGNORE" ]; then
            echo "::error::vibecraft.ignore not found."
            exit 1
          fi

          echo "VIBECRAFT_IGNORE=$VIBECRAFT_IGNORE" >> $GITHUB_ENV

      - name: Setup upstream remote
        if: env.SKIP_PUBLISH != 'true'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          UPSTREAM="${{ vars.UPSTREAM_REPO }}"

          if [ -z "$UPSTREAM" ]; then
            echo "::error::UPSTREAM_REPO not configured."
            exit 1
          fi

          gh auth setup-git

          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream "$UPSTREAM_BRANCH" || true
          git fetch upstream "$MIRROR_BRANCH" || true
          echo "UPSTREAM=$UPSTREAM" >> $GITHUB_ENV

      - name: Configure git identity
        if: env.SKIP_PUBLISH != 'true'
        run: |
          git config user.name "vibecraft-bot"
          git config user.email "vibecraft-bot@users.noreply.github.com"

      - name: Create clean tree
        if: env.SKIP_PUBLISH != 'true'
        run: |
          # mktemp creates a 0-byte file; git requires a valid index header or non-existent file
          GIT_INDEX_FILE=$(mktemp -u)
          export GIT_INDEX_FILE

          if [ "${{ github.event_name }}" = "workflow_run" ] && [ -d "protected-tree" ]; then
            # vibecraft-secure가 보호 처리한 파일로 tree 생성
            PROTECTED_DIR="$GITHUB_WORKSPACE/protected-tree"
            while IFS= read -r relpath; do
              BLOB=$(git hash-object -w "$PROTECTED_DIR/$relpath")
              git update-index --add --cacheinfo 100644,"$BLOB","$relpath"
            done < <(cd "$PROTECTED_DIR" && find . -type f -not -path './.git/*' | sed 's|^\./||')
            CLEAN_TREE=$(git write-tree)
          else
            # 기존 방식: HEAD에서 vibecraft 파일 제거
            git read-tree HEAD
            while IFS= read -r pattern || [ -n "$pattern" ]; do
              [[ "$pattern" =~ ^#.*$ ]] && continue
              [[ -z "$pattern" ]] && continue
              git rm -rf --cached --ignore-unmatch $pattern 2>/dev/null || true
            done < "$VIBECRAFT_IGNORE"
            CLEAN_TREE=$(git write-tree)
          fi

          unset GIT_INDEX_FILE
          echo "CLEAN_TREE=$CLEAN_TREE" >> $GITHUB_ENV

      - name: Create publish commit
        if: env.SKIP_PUBLISH != 'true'
        run: |
          FORK_OWNER="${{ github.repository_owner }}"
          SECURED=""
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SECURED=" [secured]"
          fi
          PUBLISH_MSG="publish: ${FORK_OWNER} -> upstream ($(date +%Y-%m-%d))${SECURED}"

          # Orphan commit (이력 없음) — force push용
          ORPHAN_COMMIT=$(git commit-tree "$CLEAN_TREE" -m "initial release")
          git branch -f "$MIRROR_BRANCH" "$ORPHAN_COMMIT"

          # PR 폴백용 커밋 (upstream/main 기반)
          if git rev-parse "upstream/$UPSTREAM_BRANCH" &>/dev/null 2>&1; then
            PARENT=$(git rev-parse "upstream/$UPSTREAM_BRANCH")
            PR_COMMIT=$(git commit-tree "$CLEAN_TREE" -p "$PARENT" -m "$PUBLISH_MSG")
            git branch -f "${MIRROR_BRANCH}-pr" "$PR_COMMIT"
          fi

          echo "PUBLISH_MSG=$PUBLISH_MSG" >> $GITHUB_ENV

      - name: Check for real changes
        if: env.SKIP_PUBLISH != 'true'
        run: |
          UPSTREAM_TREE=$(git rev-parse "upstream/$UPSTREAM_BRANCH^{tree}" 2>/dev/null || echo "")
          MIRROR_TREE=$(git rev-parse "$MIRROR_BRANCH^{tree}")

          if [ -n "$UPSTREAM_TREE" ] && [ "$UPSTREAM_TREE" = "$MIRROR_TREE" ]; then
            echo "::notice::No real changes. Skipping push."
            echo "SKIP_PUBLISH=true" >> $GITHUB_ENV
          fi

      - name: Push to upstream
        if: env.SKIP_PUBLISH != 'true'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          # 1차: orphan commit force push (이력 제거)
          if git push upstream "$MIRROR_BRANCH:$UPSTREAM_BRANCH" --force 2>/dev/null; then
            echo "::notice::Force push succeeded. Upstream has clean single commit."
            echo "PUSH_METHOD=force" >> $GITHUB_ENV
          # 2차: PR 폴백 (branch protection 등으로 force push 불가 시)
          elif git rev-parse "${MIRROR_BRANCH}-pr" &>/dev/null 2>&1; then
            PR_BRANCH="publish/$(date +%Y%m%d-%H%M%S)"
            git push upstream "${MIRROR_BRANCH}-pr:refs/heads/$PR_BRANCH" 2>/dev/null || {
              echo "::error::Both force push and PR branch push failed."
              exit 1
            }
            echo "::notice::Force push blocked. Creating PR instead."
            echo "PR_BRANCH=$PR_BRANCH" >> $GITHUB_ENV
            echo "PUSH_METHOD=pr" >> $GITHUB_ENV
          else
            echo "::error::Push failed and no PR fallback available."
            exit 1
          fi

      - name: Create PR (fallback)
        if: env.PUSH_METHOD == 'pr'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          gh pr create \
            --repo "$UPSTREAM" \
            --base "$UPSTREAM_BRANCH" \
            --head "$PR_BRANCH" \
            --title "$PUBLISH_MSG" \
            --body "Automated publish from ${{ github.repository }}. Force push was blocked by branch protection." \
            2>/dev/null || echo "::warning::PR creation failed. Branch pushed: $PR_BRANCH"

      - name: Skip notice
        if: env.SKIP_PUBLISH == 'true'
        run: echo "::notice::No changes to publish."
