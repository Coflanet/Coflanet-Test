# ============================================================
# PR Policy Check - PR/Push 제출 정책 검증
# ============================================================
# 승인된 워크플로우를 통해 제출되지 않은 PR/Push를 차단합니다.
# 내부 파일 패턴이 직접 내장되어 있어 Secret/Variable 없이 동작합니다.
#
# pull_request_target을 사용하여:
# - PR 코드가 아닌 base branch의 워크플로우가 실행됨 (우회 불가)
# - 위반 PR을 자동으로 close (Ruleset/Branch Protection 없이 동작)
#
# push 이벤트:
# - 직접 push로 내부 파일이 추가/수정되면 자동 revert (git rm + commit + push)
#
# 설치: 대상 repo의 .github/workflows/에 배치
# ============================================================

name: pr-policy-check

on:
  pull_request_target:
  push:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    name: PR Policy Check
    runs-on: ubuntu-latest
    # UPSTREAM_REPO 변수가 있으면 fork → skip (upstream에서만 동작)
    if: ${{ github.repository != 'VibeCraft2204/vibecraft.ignore' && vars.UPSTREAM_REPO == '' }}
    steps:
      - name: Checkout (push auto-revert용)
        if: github.event_name == 'push'
        uses: actions/checkout@v5

      - name: Validate contents
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # --- BEGIN PATTERNS ---
          PATTERNS=(
            "vibecraft.ignore"
            ".vibecraft/"
            ".claude/"
            ".codex/"
            ".github/workflows/vibecraft-pipeline.yml"
            ".github/workflows/sync-tag-release.yml"
            "CLAUDE.md"
            "CHANGELOG.md"
            "VIBECRAFT.md"
            ".gitattributes"
            "AGENTS.md"
            "GEMINI.md"
            ".mcp.json"
            ".cursor/"
            ".cursorrules"
            ".windsurf/"
            ".windsurfrules"
            ".aider.conf.yml"
            ".continue/"
            ".roo/"
            ".clinerules"
            ".amazonq/"
            ".kiro/"
            ".junie/"
            ".augment/"
            ".augment-guidelines"
            ".tabnine/"
            ".env"
            ".env.local"
            ".env.production"
            ".env.staging"
            "credentials.json"
            "service-account.json"
            "*.pem"
          )
          # --- END PATTERNS ---

          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            # PR: API로 변경 파일 조회 (삭제 제외)
            FILES=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[] | select(.status != "removed") | .filename')
          else
            # Push: 커밋의 추가/수정 파일 조회 (삭제 제외)
            FILES=$(gh api "repos/$REPO/commits/${{ github.sha }}" --jq '[.files[] | select(.status != "removed") | .filename] | .[]')
          fi

          FOUND_FILES=()
          for file in $FILES; do
            for pattern in "${PATTERNS[@]}"; do
              if [[ "$pattern" == */ ]]; then
                # 디렉토리 패턴: prefix 매칭
                if [[ "$file" == ${pattern}* ]]; then
                  FOUND_FILES+=("$file")
                  break
                fi
              else
                if [[ "$file" == $pattern ]]; then
                  FOUND_FILES+=("$file")
                  break
                fi
              fi
            done
          done

          if [ ${#FOUND_FILES[@]} -gt 0 ]; then
            FOUND_LIST=$(printf ', %s' "${FOUND_FILES[@]}")
            FOUND_LIST=${FOUND_LIST:2}
            echo "::error::Policy violation detected: $FOUND_LIST"

            if [ "$EVENT_NAME" = "pull_request_target" ]; then
              gh pr close "$PR_NUMBER" --repo "$REPO" \
                --comment "This PR has been automatically closed because it contains files that violate the submission policy (\`$FOUND_LIST\`). Please use the approved workflow to submit changes."
            else
              # Push: 위반 파일 자동 제거
              git config user.name "vibecraft-bot"
              git config user.email "vibecraft-bot@users.noreply.github.com"
              for f in "${FOUND_FILES[@]}"; do
                git rm -f "$f" 2>/dev/null || true
              done
              git commit -m "revert: auto-remove policy-violating files ($FOUND_LIST)

          Automatically reverted by pr-policy-check workflow"
              git push
              echo "Auto-reverted: $FOUND_LIST"
            fi
            exit 1
          fi

          echo "Policy check passed"
