name: Integration Test (E2E)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  e2e-ios:
    name: E2E Test (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true

      - name: Create .env
        run: |
          cat <<EOT > .env
          KAKAO_NATIVE_APP_KEY=${{ secrets.KAKAO_NATIVE_APP_KEY }}
          NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOT

      - name: Install dependencies
        run: flutter pub get

      - name: Boot iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' in runtime:
                  for d in devices:
                      if 'iPhone' in d['name'] and d['isAvailable']:
                          print(d['udid'])
                          sys.exit(0)
          " 2>/dev/null)
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator found"
            exit 1
          fi
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
          xcrun simctl boot "$DEVICE_ID" || true
          echo "Booted simulator: $DEVICE_ID"

      - name: Run E2E tests
        run: flutter test integration_test/app_test.dart -d "$DEVICE_ID" --no-pub

      - name: Shutdown Simulator
        if: always()
        run: xcrun simctl shutdown "$DEVICE_ID" 2>/dev/null || true
